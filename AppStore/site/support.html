<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宠刻支持</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: #392b21; background: #fffaf0; }
    body { margin: 0; }
    main { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; line-height: 1.75; }
    h1, h2 { line-height: 1.25; }
    h1 { font-size: 34px; }
    h2 { margin-top: 28px; font-size: 21px; }
    .card { background: #fff; border: 1px solid #efe3cf; border-radius: 24px; padding: 24px; box-shadow: 0 12px 40px rgba(116, 83, 38, .08); }
    .muted { color: #8b7b6b; }
    a { color: #a66b1f; }
  </style>
</head>
<body>
<main>
  <h1>宠刻支持</h1>
  <p class="muted">猫狗生活记录与共同饲养</p>
  <div class="card">
    <h2>常见问题</h2>
    <p><strong>如何恢复数据？</strong><br>使用原来的 Apple 账号登录，App 会在启动后静默同步云端记录。</p>
    <p><strong>如何共同饲养？</strong><br>主饲养员在宠物档案编辑页查看八位分享码；另一位用户在“宠物”页选择“使用分享码添加”。</p>
    <p><strong>为什么共同饲养员不能编辑档案？</strong><br>宠物档案、成员和分享权限只属于首次创建宠物的主饲养员。共同饲养员仍可维护该宠物的生活记录。</p>
    <p><strong>如何删除账号？</strong><br>进入“账号”，选择“删除账号及数据”并确认。此操作不可撤销。</p>
    <h2>联系我们</h2>
    <p>支持邮箱：<strong>提交前填写公开支持邮箱</strong></p>
    <p><a href="privacy.html">查看隐私政策</a></p>
    <p class="muted">本 App 仅保存用户主动录入的信息，不提供医疗建议、判断或看法。</p>
  </div>
</main>
</body>
</html>
